spring.application.name=youShar

# Local datasource defaults are set below via environment variable defaults

security.jwt.secret-key=3cfa76ef14937c1c0ea519f8fc57452fe28de0d628c6de766968c787228a11bc
# 1 hour
security.jwt.expiration-time=3600000
# 7 days
security.jwt.refresh-expiration-time=604800000

# Server
server.port=8081

# Datasource
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/YouShareDB?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:ahmed}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.open-in-view=false